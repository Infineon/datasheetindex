[project]
name = "datasheetindex"
version = "0.41.0"
description = "Agent-first parameter extraction from technical datasheets"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Infineon Technologies AG" }]
# PyMuPDF 2.0 bundles pymupdf4llm and the ONNX layout engine, and imports both
# whenever `pymupdf` is imported. The floor is what lets core/engine.py rely on
# that: the layout hook and the quad-corrections flag are both already set by
# the time our code runs, so it owns them from a known state (see engine.py).
#
# It also narrows the platforms this installs on, deliberately: pymupdf 2.0
# requires onnxruntime, which ships no sdist, and between them there are no
# wheels for Intel macOS, musl, glibc < 2.28, Windows ARM64 or 32-bit Windows.
# README -> "Supported platforms" lists them; 0.40.0 is the last release that
# installs there. Accepting both majors instead was rejected: on those platforms
# `[layout]` would resolve the empty pymupdf4llm 2.x and break
# extract_table_markdown, and every guard would need a test per major.
dependencies = [
    "pymupdf>=2.0",
]

[project.optional-dependencies]
# `httpx2`, not `httpx`: the two are one project either side of a rename, and
# `httpx` ended at 0.28.1 while 2.x ships under the new distribution name.
#
# The floor on `openai` is what makes this a pair. openai 3.x declares `httpx2`
# and no longer declares `httpx`, so its own transport is httpx2 -- and the
# `http_client=` we hand it must come from the same library the SDK is built
# on. It is NOT a hard type check: openai 3.5.0 accepts a plain `httpx.Client`
# and a full round trip through one succeeds (measured, not assumed -- the
# anthropic SDK in `benchmark/` *does* reject the old class, which is not the
# same situation). Declaring `httpx` anyway would install a second, redundant
# HTTP stack (httpx + httpcore alongside httpx2 + httpcore2) whose only user is
# us, and leave the SDK and its injected client on different implementations.
# One stack is the point; that is why the two bounds move together.
llm = ["openai>=3.5.0", "python-dotenv>=1.0.0", "httpx2>=2.7.0"]
# Kept so `datasheetindex[layout]` still resolves for existing consumers, but it
# adds nothing: pymupdf 2.x requires pymupdf4llm itself, and pymupdf4llm 2.x is
# an empty distribution whose code ships inside the pymupdf wheel.
layout = ["pymupdf4llm>=2.0"]
# mcp 2.x only, as of 0.41.0. 2.0.0 replaced the low-level `Server` decorators
# with constructor handlers, and `mcp_server.py` served both majors until
# nothing that installs this extra was held under the boundary any more:
# `claude-agent-sdk` 0.2.147 widened its `mcp<2.0.0` to `<3.0.0`. A consumer that
# pins mcp 1.x for its own reasons and does not install this extra is
# unaffected, because nothing outside `mcp_server.py` imports `mcp`. No upper bound:
# `_build_mcp_server` names an unsupported future major instead of failing with
# a TypeError, and an upper bound would hold back every environment we share.
#
# `jsonschema` is declared even though it resolves anyway as a core (non-extra)
# requirement of `mcp`: `mcp_server._compile_validators` imports it directly, so
# relying on someone else's dependency graph to supply it is an implicit
# dependency waiting to break.
mcp = ["mcp[cli]>=2.0.0", "jsonschema>=4.20.0"]

[project.scripts]
datasheetindex = "datasheetindex.cli:main_cli"
datasheetindex-mcp-server = "datasheetindex.mcp_server:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasheetindex"]

# The sdist is NOT constrained by the wheel's `packages` -- hatchling sweeps the
# whole working tree into it unless told otherwise, which is how `.superpowers/`
# reached the 0.21.0 sdist. `benchmark/` is a second, much worse instance: it
# carries 7.3 MiB of archived run outputs, and those embed short excerpts of
# THIRD-PARTY manufacturer datasheets. Publishing them to PyPI under Infineon's
# name is the one distribution channel that cannot be retracted, so the
# benchmark ships via the git repository only.
[tool.hatch.build.targets.sdist]
exclude = ["benchmark/", ".superpowers/", ".token-economy-artifacts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "real_pdf: tests that require the bundled real PDF fixtures",
    "integration: tests that exercise external or end-to-end integrations",
    "layout: tests that require the optional [layout] extra (pymupdf4llm)",
    "sdk: tests that require the optional 'sdk' group (claude-agent-sdk)",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.format]
# ruff 0.16 formats Python code blocks inside Markdown by default. The snippets
# in docs/ are illustrative, not runnable -- hand-aligned trailing comments and
# `...` elisions standing in for omitted code -- so formatting them degrades the
# prose. The ruff-format pre-commit hook only passes python/pyi/jupyter, so this
# keeps a bare `ruff format .` consistent with what the hook actually enforces.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["datasheetindex"]

[tool.ty.environment]
python-version = "3.13"
root = ["./src", "."]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
possibly-unresolved-reference = "warn"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.21",
    "ty>=0.0.59",
    # The checks need the mcp extra: tests/test_mcp_server.py imports `mcp`
    # directly, and ty cannot resolve it otherwise. uv has no way to enable an
    # extra by default, so declare it here -- a plain `uv sync`, which both the
    # post-checkout hook and CI run, then yields a checkable environment.
    "datasheetindex[mcp]",
]

# Not in `dev` for the same reason as `sdk` below: a plain `uv sync` is what CI
# and the pre-commit hook run in, and nothing there needs a BPE table.
# `scripts/token_economy.py` is the only consumer, and it prints an install
# hint rather than traceback when the group is absent.
bench = ["tiktoken>=0.13.0"]

# Not in `dev`, so a plain `uv sync` never pulls it: the wheel unpacks to ~263 MB,
# of which ~262 MB is a bundled `claude` CLI binary that these tests never invoke
# (create_sdk_mcp_server is pure Python).
#
# It exists because create_datasheet_tools_server is only as correct as the
# converter it feeds, and the suite used to stub that converter out entirely --
# which is how the mime_type/mimeType mismatch (#13) survived for two months.
# tests/test_sdk_integration.py runs against the real one and skips without this
# group; the default lane is covered by the faithful fake in tests/conftest.py.
sdk = ["claude-agent-sdk>=0.2.128"]
