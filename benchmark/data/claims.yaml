  # NOTE on the dropped linearity claim:
  # An earlier draft included a `si115x-linearity-vis-525nm` claim that
  # asserted R^2 >= 0.99 inferred from the responsivity slope in Table
  # 8.3 (160 ADC Counts/(W/m^2) at 525 nm). The agent correctly observed
  # that the word "linearity" does not appear anywhere in the Si115x
  # datasheet and that R^2 >= 0.99 is a *curator-inferred* threshold,
  # not a stated spec -- so it returned found=False with confidence
  # 0.93. The methodology's fidelity scorer correctly flagged this as
  # high-confidence-not-found, which is the right answer: the claim
  # was thin. The reason-stub path is exercised end-to-end by
  # the unit tests in tests/test_protocol_common.py
  # (TestStubVerdict, TestLightSensorLinearity, and
  # TestMakeStubMeasurement); we don't need a real claim to validate it.
  #
  # The claim was dropped during claim-set review. Adding a real linearity claim
  # awaits a datasheet that actually states one (or a later slice
  # that reframes the chamber benchmark to test inferred-monotonicity
  # claims explicitly, with the expected output being inconclusive).

  # ---------------------------------------------------------------------
  # ACS70331 (Allegro current sensor) -- engagement-diagnostic claims
  # ---------------------------------------------------------------------
  # Purpose: factor the training-data-recall confound out of the cross-
  # model engagement story (see docs/reproducing.md).
  # The ACS70331 is a discontinued GMR-based current sensor IC; the
  # part appears in the chamber's BOM but is less indexed in public
  # corpora than DPS310 or Si115x. Claims here have NO chamber-side
  # reproducibility verdict (chamber_protocol: engagement_diagnostic
  # returns a stub measurement so verdict() emits inconclusive). The
  # cells exist purely to measure per-model `n_tool_calls_by_tool` on
  # a less-indexed document. Each claim is tagged with its difficulty
  # tier so cross-model engagement-by-difficulty can be plotted.

