# Chamber-Grounded Benchmark — Claims
#
# Each claim is verified against (a) the source datasheet PDF (fidelity) and
# (b) the chamber data (reproducibility). The chamber's barometer is the
# Infineon DPS310. The datasheet is not shipped here; fetch it by part number
# and verify the checksum in docs/reproducing.md. A copy is also mirrored at
# hardware/datasheets/barometer.pdf in the causal-chamber repository.
#
# That mirror is NOT covered by the causal-chamber repository's CC BY 4.0
# grant, which extends to the images and .csv files in its datasets. The
# datasheets remain the copyright of their manufacturers and are mirrored
# there for convenience only.
#
# Schema notes:
#   - operating_conditions[].chamber_variable=""  -> condition is unmatchable
#     by the chamber dataset; verdict.py will flag and (if load_bearing) force
#     "inconclusive"
#   - realizable_subset is a list of [lo, hi] windows in `expected_unit` that
#     the chamber can actually exercise. Empty list = no narrowing applied.
#   - chamber_protocol is the dotted module path for the reproducibility
#     evaluator (must expose a `run(claim) -> ChamberMeasurement` function).

version: "0.1"
created: "2026-05-05"

chamber:
  name: "wt"
  configuration: "standard"
  default_dataset: "wt_validate_v1"

datasheets:
  dps310: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/barometer.pdf"
  si115x: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/light_sensor.pdf"

claims:
  # --------------------------------------------------------------------------
  # Claim 1: Relative pressure accuracy.
  # The cleanest cross-sensor test the chamber can run: four DPS310s should
  # agree on the same physical pressure to within +/- 0.06 hPa.
  # --------------------------------------------------------------------------
  - id: "dps310-relative-accuracy"
    pdf_source: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/barometer.pdf"
    parameter: "Relative pressure accuracy"
    description: >
      Stated relative accuracy of the DPS310 barometer. Tested against
      cross-sensor agreement among the four chamber DPS310s in steady state.
    expected_unit: "hPa"
    claim_kind: "dc_accuracy"
    claimed_min: -0.06
    claimed_max: 0.06
    tolerance_value: 0.06
    tolerance_kind: "absolute"
    operating_conditions:
      - { name: "temperature_C", value: 25.0, unit: "C",
          chamber_variable: "res_in", load_bearing: false }
      - { name: "supply_voltage_VDD_V", value: 3.0, unit: "V",
          chamber_variable: "", load_bearing: false }
    chamber_dataset: "wt_validate_v1"
    chamber_experiment_hint: "validate_load_out_pressure_intake"
    chamber_protocol: "chamberbench.protocols.barometer_dc_accuracy"
    primary_chamber_variable: "pressure_intake"
    cross_check_variables: ["pressure_ambient", "pressure_downwind", "pressure_upwind"]
    realizable_subset: [[940.0, 980.0]]
    source_page: [1, 5]
    source_text: "Relative accuracy: ± 0.06 hPa (or ±0.5 m)"
    value_contains: ["0.06", "hPa"]
    confidence_min: 0.7
    verified_by: "manual"
    verified_date: "2026-05-05"

  # --------------------------------------------------------------------------
  # Claim 2: Absolute pressure accuracy.
  # Cannot be tested in the strict NIST-traceable sense because we lack an
  # external reference; tested in the *necessary-but-not-sufficient* sense
  # that each chamber unit must read within +/-1 hPa of the inter-unit mean.
  # The protocol module reports this; verdict.py treats it as inconclusive
  # if the absolute-reference condition is unmatched and load-bearing.
  # --------------------------------------------------------------------------
  - id: "dps310-absolute-accuracy"
    pdf_source: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/barometer.pdf"
    parameter: "Absolute pressure accuracy"
    description: >
      Stated absolute pressure accuracy of the DPS310 barometer. The chamber
      cannot test the absolute-reference part of this claim; we report the
      inter-unit offset as a within-spec sanity check and flag the missing
      external reference as an unmatched condition.
    expected_unit: "hPa"
    claim_kind: "dc_accuracy"
    claimed_min: -1.0
    claimed_max: 1.0
    tolerance_value: 1.0
    tolerance_kind: "absolute"
    operating_conditions:
      - { name: "temperature_C", value: 25.0, unit: "C",
          chamber_variable: "res_in", load_bearing: false }
      - { name: "external_pressure_reference", unit: "hPa",
          chamber_variable: "", load_bearing: true }
    chamber_dataset: "wt_validate_v1"
    chamber_experiment_hint: "validate_load_out_pressure_intake"
    chamber_protocol: "chamberbench.protocols.barometer_dc_accuracy"
    primary_chamber_variable: "pressure_intake"
    cross_check_variables: ["pressure_ambient", "pressure_downwind", "pressure_upwind"]
    realizable_subset: [[940.0, 980.0]]
    source_page: [1, 5]
    source_text: "Absolute accuracy: ± 1 hPa (or ±8 m)"
    value_contains: ["1", "hPa"]
    confidence_min: 0.7
    verified_by: "manual"
    verified_date: "2026-05-05"

  # --------------------------------------------------------------------------
  # Claim 3 (originally seed): Pressure precision in High Precision mode.
  # Tabular claim from Table 7. The chamber's per-sensor std at fixed
  # actuator state should fall close to the spec; we score with a
  # generous 50% relative tolerance because the chamber's recorded
  # configuration mode (high-precision vs standard) is not exposed to
  # us, only sampled.
  # --------------------------------------------------------------------------
  - id: "dps310-pressure-precision-high"
    pdf_source: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/barometer.pdf"
    parameter: "Pressure precision (high precision mode)"
    description: >
      Pressure precision in High Precision mode (units: Pa RMS). Tested
      against the chamber's per-sensor steady-state std on a steady
      actuator experiment.
    expected_unit: "Pa"
    claim_kind: "typical"
    claimed_typical: 0.2
    tolerance_value: 0.5
    tolerance_kind: "relative"
    operating_conditions:
      - { name: "precision_mode_high", value: 0.0, unit: "",
          chamber_variable: "", load_bearing: true }
      - { name: "supply_voltage_VDD_V", value: 1.8, unit: "V",
          chamber_variable: "", load_bearing: false }
    chamber_dataset: "wt_validate_v1"
    chamber_experiment_hint: "validate_v_in"
    chamber_protocol: "chamberbench.protocols.barometer_dc_accuracy"
    primary_chamber_variable: "pressure_intake"
    cross_check_variables: ["pressure_ambient", "pressure_downwind", "pressure_upwind"]
    realizable_subset: [[940.0, 980.0]]
    source_page: [1, 9]
    source_text: "Pressure precision: Ap_prc 0.2 Pa RMS High Precision"
    value_contains: ["0.2", "Pa"]
    confidence_min: 0.7
    verified_by: "manual"
    verified_date: "2026-05-06"

  # --------------------------------------------------------------------------
  # Claim 4: Pressure temperature sensitivity.
  # Tabular claim Ap_tmp = 0.5 Pa/K from Table 7. The chamber doesn't
  # actively control temperature, but `res_in` records the sensor
  # temperature, and the recorded data spans a non-trivial range. The
  # protocol module today does not regress against res_in; the claim
  # passes through reproducibility as inconclusive due to the missing
  # chamber-side temperature control. Strong fidelity test.
  # --------------------------------------------------------------------------
  - id: "dps310-pressure-temp-sensitivity"
    pdf_source: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/barometer.pdf"
    parameter: "Pressure temperature sensitivity"
    description: >
      Pressure-vs-temperature sensitivity coefficient (Ap_tmp) of
      calibrated measurements. Chamber temperature is uncontrolled
      (load_bearing condition unmatched), so the verdict is forced
      inconclusive; the claim still scores fidelity.
    expected_unit: "Pa/K"
    claim_kind: "typical"
    claimed_typical: 0.5
    tolerance_value: 0.5
    tolerance_kind: "relative"
    operating_conditions:
      - { name: "controlled_temperature", value: 25.0, unit: "C",
          chamber_variable: "", load_bearing: true }
    chamber_dataset: "wt_validate_v1"
    chamber_experiment_hint: "validate_v_in"
    chamber_protocol: "chamberbench.protocols.barometer_dc_accuracy"
    primary_chamber_variable: "pressure_intake"
    cross_check_variables: ["pressure_ambient", "pressure_downwind", "pressure_upwind"]
    source_page: [1, 9]
    source_text: "Pressure temperature sensitivity Ap_tmp 0.5 Pa/K 1000hPa, 25...+65°C"
    value_contains: ["0.5", "Pa/K"]
    confidence_min: 0.7
    verified_by: "manual"
    verified_date: "2026-05-06"

  # --------------------------------------------------------------------------
  # Claim 5: Temperature accuracy (Table 6).
  # Ap_temp = +/-0.5 °C. Chamber doesn't directly control DPS310 Tj;
  # res_in is just the sensor's own temperature reading. Inconclusive
  # by load-bearing condition.
  # --------------------------------------------------------------------------
  - id: "dps310-temperature-accuracy"
    pdf_source: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/barometer.pdf"
    parameter: "Temperature accuracy"
    description: >
      Datasheet-stated temperature-accuracy band across the operating
      range. Chamber lacks an external Tj reference, so the load-bearing
      condition is unmatched and the verdict is inconclusive.
    expected_unit: "C"
    claim_kind: "dc_accuracy"
    claimed_min: -0.5
    claimed_max: 0.5
    tolerance_value: 0.5
    tolerance_kind: "absolute"
    operating_conditions:
      - { name: "external_temperature_reference", unit: "C",
          chamber_variable: "", load_bearing: true }
    chamber_dataset: "wt_validate_v1"
    chamber_experiment_hint: "validate_load_out_pressure_intake"
    chamber_protocol: "chamberbench.protocols.barometer_dc_accuracy"
    primary_chamber_variable: "pressure_intake"
    cross_check_variables: ["pressure_ambient", "pressure_downwind", "pressure_upwind"]
    source_page: [1, 8]
    source_text: "Temperature accuracy +/-0.5 °C"
    value_contains: ["0.5", "C"]
    confidence_min: 0.7
    verified_by: "manual"
    verified_date: "2026-05-06"

  # --------------------------------------------------------------------------
  # Claim 6: Current consumption at 1 Hz, low precision (Table 5).
  # I1Hz_low = 2.1 µA. Chamber doesn't measure DPS310 supply current
  # (only fan currents). Inconclusive by load-bearing condition.
  # --------------------------------------------------------------------------
  - id: "dps310-current-1hz-low-precision"
    pdf_source: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/barometer.pdf"
    parameter: "Current consumption at 1 Hz (low precision)"
    description: >
      Typical supply current at the slowest sampling rate (1 Hz), Low
      precision mode. Chamber records fan currents only, not the
      barometer's supply current; load-bearing condition unmatched ->
      inconclusive.
    expected_unit: "uA"
    claim_kind: "typical"
    claimed_typical: 2.1
    tolerance_value: 0.5
    tolerance_kind: "relative"
    operating_conditions:
      - { name: "barometer_supply_current_measurement", unit: "uA",
          chamber_variable: "", load_bearing: true }
    chamber_dataset: "wt_validate_v1"
    chamber_experiment_hint: "validate_load_out_pressure_intake"
    chamber_protocol: "chamberbench.protocols.barometer_dc_accuracy"
    primary_chamber_variable: "pressure_intake"
    cross_check_variables: ["pressure_ambient", "pressure_downwind", "pressure_upwind"]
    source_page: [1, 7]
    source_text: "Current Consumption I1Hz 2.1 µA Low precision"
    # The unicode µ (U+00B5) and the ASCII u differ; accept either and
    # only require the numeric value plus the letter A so the fidelity
    # scorer doesn't penalise the agent for using the unit symbol the
    # datasheet itself prints.
    value_contains: ["2.1", "A"]
    confidence_min: 0.7
    verified_by: "manual"
    verified_date: "2026-05-06"

  # --------------------------------------------------------------------------
  # Claim 7: VDD supply voltage range.
  # 1.7 - 3.6 V. Chamber operates at fixed (unknown to us) supply;
  # this is a range claim with no chamber-realizable subset of the
  # claimed envelope, so it routes through inconclusive.
  # --------------------------------------------------------------------------
  - id: "dps310-supply-voltage-vdd"
    pdf_source: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/barometer.pdf"
    parameter: "Supply voltage VDD"
    description: >
      Datasheet-stated VDD operating-voltage range. Chamber does not
      vary VDD during recordings; load-bearing condition unmatched.
    expected_unit: "V"
    claim_kind: "range"
    claimed_min: 1.7
    claimed_max: 3.6
    tolerance_value: 0.0
    tolerance_kind: "absolute"
    operating_conditions:
      - { name: "controlled_VDD_sweep", unit: "V",
          chamber_variable: "", load_bearing: true }
    chamber_dataset: "wt_validate_v1"
    chamber_experiment_hint: "validate_load_out_pressure_intake"
    chamber_protocol: "chamberbench.protocols.barometer_dc_accuracy"
    primary_chamber_variable: "pressure_intake"
    cross_check_variables: ["pressure_ambient", "pressure_downwind", "pressure_upwind"]
    source_page: [1]
    source_text: "Supply voltage: VDDIO: 1.2 - 3.6 V, VDD: 1.7 - 3.6 V"
    value_contains: ["1.7", "3.6", "V"]
    confidence_min: 0.7
    verified_by: "manual"
    verified_date: "2026-05-06"

  # --------------------------------------------------------------------------
  # Claim 8: Pressure measurement time, Standard mode.
  # 27.6 ms typical (Table 7 + Features). Chamber records sample rate,
  # not single-conversion time. Inconclusive.
  # --------------------------------------------------------------------------
  - id: "dps310-meas-time-standard"
    pdf_source: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/barometer.pdf"
    parameter: "Pressure measurement time (standard mode)"
    description: >
      Typical single-conversion time in Standard precision mode.
      Chamber doesn't expose per-conversion timing; inconclusive.
    expected_unit: "ms"
    claim_kind: "typical"
    claimed_typical: 27.6
    tolerance_value: 0.5
    tolerance_kind: "relative"
    operating_conditions:
      - { name: "single_conversion_timing", unit: "ms",
          chamber_variable: "", load_bearing: true }
    chamber_dataset: "wt_validate_v1"
    chamber_experiment_hint: "validate_load_out_pressure_intake"
    chamber_protocol: "chamberbench.protocols.barometer_dc_accuracy"
    primary_chamber_variable: "pressure_intake"
    cross_check_variables: ["pressure_ambient", "pressure_downwind", "pressure_upwind"]
    source_page: [1, 9]
    source_text: "Pressure measurement time t 27.6 ms Standard"
    value_contains: ["27.6", "ms"]
    confidence_min: 0.7
    verified_by: "manual"
    verified_date: "2026-05-06"

  # --------------------------------------------------------------------------
  # Claim 9: Pressure measurement rate.
  # 1-128 Hz. Chamber records pressure at the wt-data rate (separate
  # from DPS310 internal config), so the claimed range is unverifiable
  # at the part level. Inconclusive.
  # --------------------------------------------------------------------------
  - id: "dps310-pressure-rate-range"
    pdf_source: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/barometer.pdf"
    parameter: "Pressure measurement rate"
    description: >
      Datasheet-stated internal pressure-measurement rate range.
      Chamber records time-stamped data; per-DPS310 internal sampling
      rate is not directly observable.
    expected_unit: "Hz"
    claim_kind: "range"
    claimed_min: 1.0
    claimed_max: 128.0
    tolerance_value: 0.0
    tolerance_kind: "absolute"
    operating_conditions:
      - { name: "internal_sampling_rate_observable", unit: "Hz",
          chamber_variable: "", load_bearing: true }
    chamber_dataset: "wt_validate_v1"
    chamber_experiment_hint: "validate_load_out_pressure_intake"
    chamber_protocol: "chamberbench.protocols.barometer_dc_accuracy"
    primary_chamber_variable: "pressure_intake"
    cross_check_variables: ["pressure_ambient", "pressure_downwind", "pressure_upwind"]
    source_page: [9]
    source_text: "Pressure measurement rate f 1 - 128 Hz"
    value_contains: ["1", "128", "Hz"]
    confidence_min: 0.7
    verified_by: "manual"
    verified_date: "2026-05-06"

  # --------------------------------------------------------------------------
  # Claim 10: Pressure data resolution.
  # Tabular claim Ap_res = 0.06 Pa RMS from Table 7. Compares directly
  # against the chamber's per-sensor std under steady-state conditions
  # at appropriate scale. Soft pass via spec_derived tolerance.
  # --------------------------------------------------------------------------
  - id: "dps310-pressure-data-resolution"
    pdf_source: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/barometer.pdf"
    parameter: "Pressure data resolution"
    description: >
      Pressure data-resolution coefficient (Ap_res, Pa RMS). Chamber
      records the raw readout but not the configured precision mode,
      so this maps to inconclusive: a real test needs the part
      configured at the claimed mode.
    expected_unit: "Pa"
    claim_kind: "typical"
    claimed_typical: 0.06
    tolerance_value: 1.0
    tolerance_kind: "relative"
    operating_conditions:
      - { name: "precision_mode_observable", unit: "",
          chamber_variable: "", load_bearing: true }
      - { name: "supply_voltage_VDD_V", value: 1.8, unit: "V",
          chamber_variable: "", load_bearing: false }
    chamber_dataset: "wt_validate_v1"
    chamber_experiment_hint: "validate_v_in"
    chamber_protocol: "chamberbench.protocols.barometer_dc_accuracy"
    primary_chamber_variable: "pressure_intake"
    cross_check_variables: ["pressure_ambient", "pressure_downwind", "pressure_upwind"]
    realizable_subset: [[940.0, 980.0]]
    source_page: [9]
    source_text: "Pressure data resolution Ap_res 0.06 PaRMS"
    value_contains: ["0.06", "Pa"]
    confidence_min: 0.7
    verified_by: "manual"
    verified_date: "2026-05-06"

  # --------------------------------------------------------------------------
  # Claim "Operating pressure range" (was seed claim 3).
  # Range claim: 300-1200 hPa. The chamber operates well inside that window
  # (~940-980 hPa during normal operation). Reproducibility test: verify that
  # the chamber's recorded pressures fall inside the spec range, i.e. the
  # part is operating within its stated envelope. This passes trivially but
  # tests fidelity: does the agent extract "300" and "1200" with the right
  # unit?
  # --------------------------------------------------------------------------
  - id: "dps310-operating-range"
    pdf_source: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/barometer.pdf"
    parameter: "Operating pressure range"
    description: >
      Datasheet-stated operating pressure range (hPa). The chamber
      operates comfortably inside that window. Reproducibility check
      is whether the chamber's observed pressures lie inside the
      claimed range; the realizable_subset narrows the verdict to the
      chamber-exercisable subset of that window.
    expected_unit: "hPa"
    claim_kind: "range"
    claimed_min: 300.0
    claimed_max: 1200.0
    tolerance_value: 0.0
    tolerance_kind: "absolute"
    operating_conditions:
      - { name: "temperature_C", min_value: -40.0, max_value: 85.0, unit: "C",
          chamber_variable: "res_in", load_bearing: false }
    chamber_dataset: "wt_validate_v1"
    chamber_experiment_hint: "validate_load_out_pressure_intake"
    chamber_protocol: "chamberbench.protocols.barometer_dc_accuracy"
    primary_chamber_variable: "pressure_intake"
    cross_check_variables: ["pressure_ambient", "pressure_downwind", "pressure_upwind"]
    realizable_subset: [[940.0, 980.0]]
    source_page: [1, 5]
    source_text: "Operation range: Pressure: 300 -1200 hPa. Temperature: -40 - 85 °C."
    value_contains: ["300", "1200", "hPa"]
    confidence_min: 0.7
    verified_by: "manual"
    verified_date: "2026-05-05"

  # ==========================================================================
  # Si115x light-sensor claims.
  #
  # Source: hardware/datasheets/light_sensor.pdf (Silicon Labs Si115x Rev. 1.4).
  # Chamber: light tunnel (lt_*); the chamber has 3 Si115x units at distinct
  # positions (vis_1/vis_2/vis_3 + ir_1/2/3). They are NOT spatially redundant
  # (recon: vis_1 ~10000, vis_2 ~1500, vis_3 ~480 at fixed RGB), so the
  # cross-sensor sigma protocol from the DPS310 path does not apply. The
  # light-sensor protocol module supports two reproducibility paths today:
  #   - claim_kind="typical" -> per-channel std at fixed RGB (precision)
  #   - claim_kind="range"   -> per-channel mean inside [min, max] (envelope)
  # claim_kind="linearity" routes to inconclusive via reason-stub (deferred
  # pending dataset and framing decisions; verified end-to-end by a
  # later fix).
  #
  # Honest mix: 1 reproducibility-PASS (claim 11, ADC envelope) + 9 inconclusive.
  # The chamber lacks a NIST-traceable optical reference and does not expose
  # supply current, supply voltage, per-conversion timing, or calibrated
  # temperature in degrees C, so most Si115x claims must route to inconclusive
  # via load-bearing condition gaps -- exactly the methodology's design intent.
  # --------------------------------------------------------------------------

  # --------------------------------------------------------------------------
  # Claim 11: ADC bit-depth envelope.
  # Si115x has dual 23-bit ADCs (overview, page 1). Chamber's vis_1 reads
  # ~7000 on validate_diode_vis_1 -- well within [0, 8388607]. Trivially
  # passes the reproducibility-envelope test. Fidelity test forces the
  # agent to extract "23-bit" from page 1 features.
  # --------------------------------------------------------------------------
  - id: "si115x-adc-bit-depth"
    pdf_source: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/light_sensor.pdf"
    parameter: "ADC bit depth (visible channel envelope)"
    description: >
      Datasheet-stated ADC resolution (bit depth). Reproducibility test:
      chamber's vis_1 readings fall inside the implied count envelope.
      Trivially passes; tests the agent's extraction of structural
      features from the overview text.
    expected_unit: "counts"
    claim_kind: "range"
    claimed_min: 0.0
    claimed_max: 8388607.0
    tolerance_value: 0.0
    tolerance_kind: "absolute"
    operating_conditions: []
    chamber_dataset: "lt_validate_v1"
    chamber_experiment_hint: "validate_diode_vis_1"
    chamber_protocol: "chamberbench.protocols.light_sensor"
    primary_chamber_variable: "vis_1"
    cross_check_variables: []
    source_page: [1]
    source_text: "dual 23-bit analog-to-digital converters"
    value_contains: ["23", "bit"]
    confidence_min: 0.7
    verified_by: "manual"
    verified_date: "2026-05-07"

  # --------------------------------------------------------------------------
  # Claim 12: Operating temperature range.
  # Spec: -40 to +85 C (Table 8.1 + Absolute Maximum Ratings, Table 8.7).
  # Chamber records sensor temperature as `t_vis_1` but in raw register
  # units (e.g. constant value `3` in validate_osr_c), NOT calibrated C.
  # We lack the t-register-to-degrees-C calibration, so the load-bearing
  # condition `external_temperature_reference` is unmatched and the
  # verdict is forced to inconclusive. Strong fidelity test.
  # --------------------------------------------------------------------------
  - id: "si115x-operating-temperature"
    pdf_source: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/light_sensor.pdf"
    parameter: "Operating temperature range"
    description: >
      Datasheet-stated operating ambient-temperature range (C). Chamber
      records the Si115x's internal temperature register as a raw
      integer, not calibrated C; load-bearing condition unmatched ->
      inconclusive.
    expected_unit: "C"
    claim_kind: "range"
    claimed_min: -40.0
    claimed_max: 85.0
    tolerance_value: 0.0
    tolerance_kind: "absolute"
    operating_conditions:
      - { name: "external_temperature_reference", unit: "C",
          chamber_variable: "", load_bearing: true }
    chamber_dataset: "lt_validate_v1"
    chamber_experiment_hint: "validate_diode_vis_1"
    chamber_protocol: "chamberbench.protocols.light_sensor"
    primary_chamber_variable: "t_vis_1"
    cross_check_variables: []
    source_page: [47, 52]
    source_text: "Operating Temperature T -40 25 85 C"
    value_contains: ["-40", "85", "C"]
    confidence_min: 0.7
    verified_by: "manual"
    verified_date: "2026-05-07"

  # --------------------------------------------------------------------------
  # Claim 13: VDD supply voltage range.
  # Spec: 1.62 - 3.6 V (Table 8.1). Chamber doesn't sweep VDD on the
  # Si115x; load-bearing condition unmatched. Same shape as
  # dps310-supply-voltage-vdd. Fidelity test exercises table extraction.
  # --------------------------------------------------------------------------
  - id: "si115x-supply-voltage-vdd"
    pdf_source: "https://raw.githubusercontent.com/juangamella/causal-chamber/main/hardware/datasheets/light_sensor.pdf"
    parameter: "VDD supply voltage range"
    description: >
      Datasheet-stated VDD operating-voltage range. Chamber does not
      vary VDD during recordings; load-bearing condition unmatched.
    expected_unit: "V"
    claim_kind: "range"
