# Fourth component: fidelity-only extension of the chamber benchmark.
#
# A reviewer asked whether the dispatch-instrumentation result generalises past
# the three-component corpus. The chamber's bill of
# materials already includes this Allegro A4988 motor driver, which the paper's
# Appendix D excluded "because it adds no agentic-navigation stress" -- a
# rationale about difficulty, not about measurability, and one that stops
# applying once the physical oracle is demoted to a secondary contribution.
#
# These claims are deliberately kept OUT of data/claims.yaml. The
# 25-claim set is frozen and every number in the paper is measured on it; this
# is a separate population, reported separately, so the generalisation step is
# visible rather than folded into a headline.
#
# Fidelity only. The chamber cannot stage a motor driver, so no claim here
# receives a reproducibility verdict -- `chamber_protocol` and
# `primary_chamber_variable` are present because ClaimSpec requires them, and
# they are never exercised. Do not read a reproducibility number off this file.
#
# Curation follows the same rule as the frozen set: a quantitative parameter
# with an explicit value, unit and stated operating condition, transcribed from
# the datasheet's own tables. `description` carries no value, no page and no
# unit -- the oracle-leak audit (Appendix C) applies here too, and these
# descriptions were written to the post-audit contract, and (since 2026-07-26)
# are enforced by the same lint as claims.yaml: `tests/test_chamber_prompts.py`
# parametrises TestClaimsYamlHygiene over both files.
#
# Provenance. `source_page`, `source_text`, `verified_by` and `verified_date` are
# populated for all 12, because their absence was a fair objection: this is the
# only gold set authored *after* its models' output had been observed, so it is
# the one that most needs an audit trail, and it shipped with the weakest one.
# Each `source_text` is the table row as the PDF's text layer reads it and was
# machine-checked present in the named page under whitespace normalisation --
# hence `verified_by: pdf_text_layer` rather than the frozen set's `manual`,
# which would misdescribe how these were produced.
#
# `tolerance_value` / `tolerance_kind` are deliberately left at their defaults.
# They feed chamber grading, no claim here receives a chamber verdict, and
# inventing tolerances so a field-completeness table looks full would be a worse
# defect than the empty field it hides.
#
# Independence, stated because it is not obvious: this PDF is also the decoy the
# rebuttal's wrong-content arm served. Both models had therefore already been
# observed transcribing some of these rows correctly before these claims were
# written. The rules were never developed against this document; the *document*
# was not unseen. Treat 12/12 accordingly.
#
# Needle quality. The frozen set has 8 of 30 numeric needles at <= 2 characters
# (scripts/strict_fidelity_rescore.py), which makes a substring match weak
# evidence on those claims. Here 7 of **18** numeric needles are <= 2 characters
# -- "35", "8", "11", "30", "40", "85", "4" -- because those are the datasheet's
# actual values and shortening them is not an option. That is 39% against the
# frozen set's 27%, so this file's needles are *weaker* than the ones already
# conceded to be weak, not comparable to them. The mitigation is to report both
# matchers: exact numeric matching is the primary score for this component, with
# the substring score alongside for comparability with the frozen 25.

meta:
