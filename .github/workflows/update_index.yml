name: Update Datasheet Product Index

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Optional product sitemap page limit for test runs"
        required: false
        default: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install indexing dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch Infineon product source and build shards
        run: |
          if [ "${{ inputs.max_pages || '0' }}" = "0" ]; then
            python scripts/crawler.py --infineon-live
          else
            python scripts/crawler.py --infineon-live --max-pages "${{ inputs.max_pages }}"
          fi

      - name: Build BM25 indexes
        run: python scripts/build_index.py

      - name: Commit generated data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/
          git diff --staged --quiet || git commit -m "Auto-update product search index"
          git push
