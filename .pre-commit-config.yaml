repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # `benchmark/archive/` holds archived model outputs that published
      # results are computed from. It is evidence, and a hook that rewrites it
      # -- even to append a newline -- makes the released bytes differ from the
      # ones that produced the numbers. Excluded from both fixers for that
      # reason, not for convenience.
      - id: trailing-whitespace
        exclude: ^benchmark/archive/
      - id: end-of-file-fixer
        exclude: ^benchmark/archive/
      - id: check-yaml
      - id: check-added-large-files
        # The archive carries several multi-MB result files; they are the point
        # of the release, so raise the ceiling rather than exclude the check.
        args: ['--maxkb=3000', '--enforce-all']

  # uv hooks - keep uv.lock in sync with pyproject.toml
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.32
    hooks:
      - id: uv-lock

  # Ruff - linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ty - type checking
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.63
    hooks:
      - id: ty

  - repo: local
    hooks:
      - id: pytest
        name: unit tests
        entry: uv run --no-sync pytest -q -m "not integration and not real_pdf"
        language: system
        types: [python]
        pass_filenames: false

      # Auto-sync after pull/checkout
      - id: uv-sync
        name: uv sync
        entry: uv sync
        language: system
        always_run: true
        pass_filenames: false
        stages: [post-merge, post-checkout]
